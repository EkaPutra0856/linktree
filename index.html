<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LinkTree Bio</title>
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: sans-serif;
      overflow-x: hidden;
    }



    
    /* Background Video */
    .bg-video {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
    }

    /* Container Tombol */
    .button-container {
      position: absolute;
      bottom: 10px;
      left: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Tombol Glossy + Idle Animasi */
    .glow-button {
      background: linear-gradient(135deg, #007bff, #00c6ff);
      color: white;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, border-radius 0.3s ease;
      animation: idlePulse 2.5s ease-in-out infinite;
    }

    .glow-button:hover {
      transform: scale(1.03);
    }

    .glow-button::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(120deg, rgba(255,255,255,0.3), rgba(255,255,255,0));
      transform: rotate(45deg);
      animation: glossySweep 3s infinite;
    }

    @keyframes idlePulse {
      0%, 100% {
        transform: scale(1);
        border-radius: 12px;
      }
      50% {
        transform: scale(1.01);
        border-radius: 20px;
      }
    }

    @keyframes glossySweep {
      0% {
        transform: translateX(-100%) rotate(45deg);
      }
      50% {
        transform: translateX(100%) rotate(45deg);
      }
      100% {
        transform: translateX(-100%) rotate(45deg);
      }
    }
  </style>
</head>
<body>

  <!-- Background Video -->
\

  <!-- Tombol Link -->
  <div class="button-container">
    <a href="https://youtube.com" target="_blank" class="glow-button">Link ke YouTube</a>
    <a href="https://yahoo.com" target="_blank" class="glow-button">Link ke Yahoo</a>
  </div>

</body>
</html>
