<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment</title>
  <link rel="stylesheet" href="payment-style.css" />
  <link rel="stylesheet" href="shared-style.css" />
</head>
<body>
  <!-- Background Video -->
  <video autoplay muted loop class="bg-video">
    <source src="your-video.mp4" type="video/mp4" />
    Browser Anda tidak mendukung video.
  </video>

  <!-- Header dan Tombol Kembali -->
  <div class="header">
    <a href="index.html" class="back-button">← Kembali</a>
    <h1 class="judul">Pilih Metode Pembayaran</h1>
  </div>

  <!-- Container Tombol Pembayaran -->
  <div class="button-container">
    <button class="glow-button payment-btn" data-payment="Dana">
      <img src="https://images.seeklogo.com/logo-png/39/1/dana-e-wallet-app-logo-png_seeklogo-399948.png" alt="DANA" />
      <div class="button-text">Bayar dengan Dana</div>
    </button>
    <button class="glow-button payment-btn" data-payment="Shopee Pay">
      <img src="https://images.seeklogo.com/logo-png/40/1/shopee-pay-logo-png_seeklogo-406839.png" alt="Shopee Pay" />
      <div class="button-text">Bayar dengan Shopee Pay</div>
    </button>
    <button class="glow-button payment-btn" data-payment="Gopay">
      <img src="https://images.seeklogo.com/logo-png/36/1/gopay-logo-png_seeklogo-369813.png" alt="GoPay" />
      <div class="button-text">Bayar dengan GoPay</div>
    </button>
    <button class="glow-button payment-btn" data-payment="BNI Virtual Account">
      <img src="https://images.seeklogo.com/logo-png/35/1/bank-bni-logo-png_seeklogo-355606.png" alt="BNI" />
      <div class="button-text">BNI Virtual Account</div>
    </button>
  </div>

  <!-- Modal Pembayaran -->
  <div id="paymentModal" class="modal">
    <div class="modal-content">
      <span id="closeBtn" class="close">&times;</span>
  
      <!-- Bagian Gambar -->
      <img id="paymentImg" src="" alt="Metode Pembayaran" style="max-width: 100px; margin-bottom: 20px;" />
  
      <!-- Bagian Teks dan Tombol Copy Bersebelahan -->
      <div class="payment-info-container">
        <input type="text" id="paymentInfo" readonly />
        <button id="copyBtn">Copy</button>
      </div>
  
      <!-- Teks Keterangan Biasa -->
      <p id="paymentDetails" class="payment-details"></p>
    </div>
  </div>
  

  <!-- JS Script -->
  <script>
    const modal = document.getElementById("paymentModal");
    const closeBtn = document.getElementById("closeBtn");
    const paymentImg = document.getElementById("paymentImg");
    const paymentInfo = document.getElementById("paymentInfo");
    const copyBtn = document.getElementById("copyBtn");

    const paymentButtons = document.querySelectorAll(".payment-btn");

    const paymentDetails = {
      "BNI Virtual Account": {
        img: "payment/BNI.jpg",
        text: "Silakan transfer ke Virtual Account BNI dengan nomor 1446792569 AN: Eka Putra Meravigliosi.",
        info: "1446792569"
      },
      "Dana": {
        img: "payment/Dana.jpg",
        text: "Silakan transfer melalui aplikasi Dana ke nomor 085740875048 AN: Eka Putra Meravigliosi.",
        info: "085740875048"
      },
      "Shopee Pay": {
        img: "payment/1.jpg",
        text: "Silakan transfer melalui Shopee Pay ke nomor 085740875048 AN: Eka Putra Meravigliosi.",
        info: "085740875048"
      },
      "Gopay": {
        img: "payment/Gopay.jpg",
        text: "Silakan transfer melalui Gopay ke nomor085740875048 AN: Eka Putra Meravigliosi.",
        info: "085740875048"
      }
    };

    paymentButtons.forEach(button => {
      button.addEventListener("click", (e) => {
        const paymentMethod = button.getAttribute("data-payment");
        const details = paymentDetails[paymentMethod];

        // Set Image
        paymentImg.src = details.img;

        // Set Info Number
        paymentInfo.value = details.info;

        // Set Description Text
        paymentDetailsElement = document.getElementById("paymentDetails");
        paymentDetailsElement.textContent = details.text;

        // Show Modal
        modal.classList.add("show");
      });
    });

    closeBtn.addEventListener("click", () => modal.classList.remove("show"));

    copyBtn.addEventListener("click", () => {
      paymentInfo.select();
      document.execCommand("copy");
      alert("Nomor telah disalin!");
    });
  </script>

  <!-- Minimal CSS untuk modal -->
  <style>
    .modal {
      display: none;
      position: fixed;
      z-index: 99;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
    }
    .modal.show {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      position: relative;
    }
    .close {
      position: absolute;
      right: 10px;
      top: 5px;
      font-size: 24px;
      cursor: pointer;
    }
  </style>
</body>
</html>
